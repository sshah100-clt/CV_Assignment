data:
  root: data
  split_file: splits/folds.json
  fold: 3
  img_size: 64
  color: gray
  channels: 1
  normalize: half
  resize_mode: squash
  num_workers: 6
  augment:
    random_resized_crop: null
    hflip: false
model:
  name: simple_cnn
  widths:
  - 32
  - 64
  - 128
  - 256
  dropout: 0.0
  attention: none
  pool: avg
  pretrained: none
  freeze_backbone: false
optim:
  name: adam
  lr: 0.002
  weight_decay: 0.0
  backbone_lr_mult: 1.0
schedule:
  name: constant
  warmup_epochs: 0
train:
  epochs: 20
  batch_size: 64
  label_smoothing: 0.0
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
